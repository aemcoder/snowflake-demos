<!-- Knack Stardust design system — lifted verbatim from /stardust/migrated/ -->
<script nonce="aem">document.documentElement.classList.add('js')</script>
<noscript><style>.reveal{opacity:1!important;transform:none!important}.row{opacity:1!important;transform:none!important}</style></noscript>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fff; --surface:#fafafa; --surface2:#f5f3f5; --ink:#1a181d; --muted:#75787b;
    --primary:#982a86; --primary-dark:#821570; --accent:#ff349a; --coral:#fa816e; --border:#e9e5e9;
    --grad-brand:linear-gradient(120deg,#982a86 0%,#e61875 55%,#fa816e 100%);
    --grad-coral:linear-gradient(90deg,#982a86 0%,#fa816e 100%);
    --wash:linear-gradient(180deg,#fdeef8 0%,#ffffff 70%);
    --sm:0 1px 2px rgba(26,24,29,.06); --md:0 8px 24px rgba(26,24,29,.10); --lg:0 24px 60px rgba(130,21,112,.18);
    --e-enter:cubic-bezier(.25,.46,.45,.94); --e-expo:cubic-bezier(.16,1,.3,1);
  }
  *{box-sizing:border-box;margin:0}
  html{scroll-behavior:smooth}
  body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1180px;margin:0 auto;padding:0 24px}
  h1,h2,h3{letter-spacing:-.02em;line-height:1.08;font-weight:700}
  h1{font-size:clamp(2.6rem,5.2vw,4.1rem)}
  h2{font-size:clamp(1.9rem,3.4vw,2.6rem)}
  h3{font-size:1.25rem;letter-spacing:-.01em}
  p{color:#3a3640}
  a{color:inherit;text-decoration:none}
  section{padding:84px 0}
  .center{text-align:center;max-width:680px;margin:0 auto 48px}
  .eyebrow{font-size:.8rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--primary)}
  .btn{display:inline-flex;align-items:center;gap:.5rem;font-weight:600;font-size:1rem;border-radius:12px;padding:14px 26px;border:0;cursor:pointer;transition:.18s}
  .btn-primary{background:var(--accent);color:#fff;box-shadow:0 6px 18px rgba(255,52,154,.32)}
  .btn-primary:hover{transform:translateY(-2px)}
  .link-sec{font-weight:600;color:var(--primary)}

  .promo{background:var(--primary-dark);color:#fff;text-align:center;font-size:.9rem;font-weight:500;padding:10px}
  .promo b{color:#ffd6ec}
  header.nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
  .nav-in{display:flex;align-items:center;gap:32px;height:72px}
  .nav-in img{height:30px}
  .nav-links{display:flex;gap:26px;margin-left:8px}
  .nav-links a{font-size:.95rem;font-weight:500;color:#3a3640}
  .nav-cta{margin-left:auto;display:flex;align-items:center;gap:18px}

  /* hero with live app */
  .hero{background:var(--wash);padding:72px 0 64px;overflow:hidden}
  .hero-grid{display:grid;grid-template-columns:1fr 1.05fr;gap:48px;align-items:center}
  .hero h1 span{background:var(--grad-coral);-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero .sub{font-size:1.3rem;color:#4a454f;margin:22px 0 30px;max-width:520px}
  .hero-cta{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
  .trust{display:flex;align-items:center;gap:10px;margin-top:26px;font-size:.9rem;color:var(--muted)}
  .stars{color:#ff8a3d;letter-spacing:2px}

  /* live app mock */
  .app{position:relative;background:#fff;border:1px solid var(--border);border-radius:18px;box-shadow:var(--lg);overflow:hidden}
  .app-bar{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--border);background:#fbf7fb}
  .app-bar .d{width:11px;height:11px;border-radius:50%;background:#e7c9e1}
  .app-bar .title{margin-left:10px;font-weight:700;font-size:.85rem;color:var(--primary)}
  .app-bar .live{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:.72rem;font-weight:700;color:#16a34a;text-transform:uppercase;letter-spacing:.06em}
  .app-bar .pulse{width:9px;height:9px;border-radius:50%;background:#16c784;animation:pulse 1.6s var(--e-enter) infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(22,199,132,.5)}70%{box-shadow:0 0 0 8px rgba(22,199,132,0)}100%{box-shadow:0 0 0 0 rgba(22,199,132,0)}}
  .app-body{padding:18px;position:relative}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
  .kpi .l{font-size:.68rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
  .kpi .v{font-size:1.45rem;font-weight:800;letter-spacing:-.02em}
  .kpi .v.pink{color:var(--accent)} .kpi .v.mag{color:var(--primary)}
  .bar{height:7px;border-radius:99px;background:#eee;overflow:hidden;margin-top:8px}
  .bar i{display:block;height:100%;background:var(--grad-coral);width:var(--fill,0%);transition:width 1.1s var(--e-expo)}
  table.rows{width:100%;border-collapse:collapse;font-size:.82rem}
  table.rows th{text-align:left;color:var(--muted);font-weight:700;font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;padding:8px 10px;border-bottom:1px solid var(--border)}
  table.rows td{padding:9px 10px;border-bottom:1px solid #f1edf1}
  html.js .row{opacity:0;transform:translateY(14px) rotateX(8deg);transform-origin:top}
  .pill-s{font-size:.68rem;font-weight:700;padding:3px 9px;border-radius:99px}
  .s-live{background:#e6f8ef;color:#16a34a} .s-build{background:#fdeef8;color:var(--primary)} .s-queue{background:#fff3e6;color:#c2710c}
  .rowdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#16c784;margin-right:7px;vertical-align:middle;animation:pulse 1.6s var(--e-enter) infinite}
  .sweep{position:absolute;inset:0;pointer-events:none;background:linear-gradient(100deg,transparent 30%,rgba(255,52,154,.10) 50%,transparent 70%);transform:translateX(-120%)}
  .build-anim .sweep{animation:sweep 5.4s var(--e-enter) 2.5s infinite}
  @keyframes sweep{0%{transform:translateX(-120%)}60%,100%{transform:translateX(120%)}}

  /* reveal-on-scroll */
  html.js .reveal{opacity:0;transform:translateY(22px);transition:opacity .6s var(--e-enter),transform .6s var(--e-enter)}
  html.js .reveal.in{opacity:1;transform:none}

  .proof{padding:48px 0}.proof p{text-align:center;color:var(--muted);font-weight:600;margin-bottom:24px}
  .logos{display:flex;flex-wrap:wrap;justify-content:center;gap:14px 40px;align-items:center;filter:grayscale(1);opacity:.7}
  .logos span{font-weight:800;font-size:1.15rem;color:#8a8a8a}

  .switch-tabs{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:34px}
  .tab{border:1px solid var(--border);background:#fff;border-radius:9999px;padding:11px 22px;font-weight:600;font-size:.95rem;cursor:pointer;color:#3a3640;transition:.16s}
  .tab[aria-selected=true]{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 6px 16px rgba(152,42,134,.3)}
  .panel{display:none}
  .panel.on{display:grid;grid-template-columns:.85fr 1.15fr;gap:36px;align-items:center;background:linear-gradient(160deg,#fdeef8,#fff);border:1px solid var(--border);border-radius:22px;padding:30px;box-shadow:var(--md)}
  .panel img{width:100%;border-radius:14px;box-shadow:var(--md);border:1px solid var(--border)}
  .panel h3{margin-bottom:12px;font-size:1.6rem}

  .cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
  .vcard{background:#fff;border:1px solid var(--border);border-radius:14px;padding:30px;box-shadow:var(--sm);transition:.2s}
  .vcard:hover{transform:translateY(-4px);box-shadow:var(--md)}
  .vcard .ic{width:46px;height:46px;border-radius:12px;background:var(--grad-coral);display:grid;place-items:center;color:#fff;font-size:1.3rem;margin-bottom:16px}

  .compare{background:var(--surface2)}
  .cmp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:14px}
  .cmp{background:#fff;border:1px solid var(--border);border-radius:14px;padding:26px}
  .cmp.knack{background:var(--primary);color:#fff;box-shadow:var(--lg);transform:scale(1.03)}
  .cmp h3{font-size:1.05rem;margin-bottom:14px}.cmp ul{list-style:none;padding:0;display:grid;gap:10px;font-size:.93rem}
  .cmp li{display:flex;gap:9px}.cmp li::before{content:"✕";color:#c95;font-weight:700}.cmp.knack li::before{content:"✓";color:#9affd0}
  .cmp .vs{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;opacity:.7;margin-bottom:6px}

  .grid6{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
  .ccard{background:#fff;border:1px solid var(--border);border-radius:14px;padding:26px;box-shadow:var(--sm)}
  .ccard .ic{font-size:1.6rem;margin-bottom:12px}.ccard h3{font-size:1.1rem;margin-bottom:8px}.ccard p{font-size:.92rem;color:var(--muted)}

  .integ{background:var(--grad-brand);color:#fff}
  .integ .center p{color:rgba(255,255,255,.9)}
  .integ-logos{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;max-width:760px;margin:0 auto 30px}
  .integ-logos div{width:64px;height:64px;border-radius:14px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-weight:800}
  .integ .btn-primary{background:#fff;color:var(--primary)}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;text-align:center}
  .stat .n{font-size:3rem;font-weight:800;background:var(--grad-coral);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-.03em}
  .stat p{color:var(--muted);font-weight:600}
  .story{margin-top:44px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:32px;display:flex;gap:24px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .story blockquote{font-size:1.25rem;font-weight:600;max-width:640px;margin:0}

  .faq{max-width:820px;margin:0 auto}
  details{border-bottom:1px solid var(--border);padding:20px 4px}
  summary{font-weight:600;font-size:1.08rem;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:16px}
  summary::-webkit-details-marker{display:none}summary::after{content:"+";color:var(--primary);font-weight:700;font-size:1.4rem}
  details[open] summary::after{content:"–"}details p{margin-top:12px;color:var(--muted)}

  .final{background:var(--grad-brand);color:#fff;text-align:center}
  .final h2{font-size:clamp(2rem,4vw,3rem)}.final p{color:rgba(255,255,255,.92);font-size:1.15rem;margin:14px 0 28px}
  .final .btn-primary{background:#fff;color:var(--primary)}

  footer{background:#16151a;color:#b8b4bd;padding:60px 0 40px}
  .foot-grid{display:grid;grid-template-columns:1.4fr repeat(4,1fr);gap:30px}
  footer img{height:28px;filter:brightness(0) invert(1);margin-bottom:14px}
  footer h4{color:#fff;font-size:.85rem;text-transform:uppercase;letter-spacing:.08em;margin-bottom:14px}
  footer ul{list-style:none;padding:0;display:grid;gap:9px;font-size:.92rem}.foot-bot{border-top:1px solid #2a2830;margin-top:40px;padding-top:24px;font-size:.85rem;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}

  @media(max-width:900px){.hero-grid,.panel.on,.cards3,.cmp-grid,.grid6,.stats,.foot-grid{grid-template-columns:1fr}.nav-links{display:none}.cmp.knack{transform:none}.kpis{grid-template-columns:1fr 1fr}}

  @media(prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
    .row{opacity:1!important;transform:none!important}
    .reveal{opacity:1!important;transform:none!important}
    .bar i{transition:none!important}
    .sweep{display:none!important}
  }

  /* megamenu */
  header.nav{position:sticky}
  .nav-links{align-items:center}
  .mm-item{position:static;display:inline-flex;align-items:center}
  .mm-btn{font:inherit;font-size:.95rem;font-weight:500;color:#3a3640;background:none;border:0;cursor:pointer;padding:0;display:inline-flex;align-items:center;gap:6px}
  .mm-btn::after{content:"";width:6px;height:6px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);margin-top:-3px;opacity:.55;transition:.2s}
  .mm-btn:hover{color:var(--primary)}
  .mm-btn[aria-expanded=true]{color:var(--primary)}
  .mm-btn[aria-expanded=true]::after{transform:rotate(-135deg);margin-top:2px;opacity:1}
  .megamenu{position:absolute;left:0;right:0;top:100%;background:#fff;border-top:1px solid var(--border);box-shadow:0 30px 60px rgba(26,24,29,.16);opacity:0;visibility:hidden;transform:translateY(-10px);transition:opacity .18s,transform .18s,visibility .18s;z-index:60}
  .megamenu.open{opacity:1;visibility:visible;transform:none}
  .mm-inner{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:1fr 360px;min-height:300px}
  .mm-main{padding:34px 28px}
  .mm-head{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;margin-bottom:4px;color:var(--ink)}
  .mm-sub{color:var(--muted);font-size:.95rem;margin-bottom:22px}
  .mm-eyebrow{font-size:.72rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 14px}
  .mm-cols{display:grid;gap:22px 30px}
  .mm-cols.c3{grid-template-columns:repeat(3,1fr)}
  .mm-cols.c2{grid-template-columns:repeat(2,1fr)}
  .mm-link{display:flex;gap:12px;align-items:flex-start;padding:9px 8px;border-radius:10px;transition:background .14s}
  .mm-link:hover{background:var(--surface)}
  .mm-link .ic{flex:none;width:34px;height:34px;border-radius:9px;background:#fdeef8;color:var(--primary);display:grid;place-items:center;font-size:1rem}
  .mm-link .tx b{font-weight:600;font-size:.95rem;display:block;color:var(--ink)}
  .mm-link .tx span{color:var(--muted);font-size:.82rem;line-height:1.4}
  .mm-foot{grid-column:1/-1;border-top:1px solid var(--border);margin-top:18px;padding-top:18px;display:flex;gap:30px;flex-wrap:wrap}
  .mm-foot a{font-weight:700;color:var(--primary);font-size:.92rem}
  .mm-promo{background:linear-gradient(160deg,#3a0a33,#2a0826);color:#fff;padding:34px 30px;display:flex;flex-direction:column}
  .mm-promo h3{color:#fff;font-size:1.45rem;letter-spacing:-.01em;margin-bottom:6px}
  .mm-promo>p{color:rgba(255,255,255,.8);font-size:.9rem;margin-bottom:6px}
  .mm-promo a.pl{display:block;margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,.16)}
  .mm-promo a.pl b{color:#fff;font-weight:700;font-size:.95rem}
  .mm-promo a.pl span{color:rgba(255,255,255,.72);font-size:.84rem;display:block;margin-top:4px}
  .mm-promo .pbtn{margin-top:auto;background:var(--accent);color:#fff;font-weight:700;padding:12px 18px;border-radius:10px;text-align:center;font-size:.9rem;align-self:flex-start;margin-top:24px}
  @media(max-width:900px){.megamenu{display:none}}
</style>

<!-- EDS ↔ Stardust bridge — scoped to body.knack to avoid leaking to other pages -->
<style>
  /* Neutralize EDS boilerplate typography on Knack pages.
     :where() zeroes out the element contribution so specificity is (0,1,0).
     That beats boilerplate base rules (0,0,1) but loses to Stardust
     component-specific rules like .final p (0,1,1) — so those are preserved. */
  body.knack {
    font-size: 16px;
    font-family: Inter, system-ui, sans-serif;
  }
  body.knack :where(h1, h2, h3, h4, h5, h6) {
    font-family: Inter, system-ui, sans-serif;
    margin-top: 0;
    margin-bottom: 0;
  }
  body.knack :where(p, dl, ol, ul) {
    margin: 0;
  }
  body.knack a:any-link {
    color: inherit;
    text-decoration: none;
  }
  body.knack a:hover {
    color: inherit;
    text-decoration: none;
  }
  /* Empty header/footer placeholders take no space */
  body.knack header {
    height: 0;
  }
  /* Neutralize EDS section margins, padding, and max-width */
  body.knack main > .section {
    margin: 0;
    padding: 0;
    max-width: none;
  }
  body.knack main > .section > div {
    max-width: none;
    padding: 0;
    margin: 0;
  }
</style>
